[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locqa"
version = "0.1.0"
description = "Localization QA for game scripts, EN → JA. Graph-aware, offline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["localization", "l10n", "qa", "japanese", "games", "renpy", "xliff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Quality Assurance",
]

# PyYAML reads the project config and nothing else. The checks themselves have
# no dependencies, and the tool makes no network calls.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Only the threshold sweep's --plot needs this; eval/ runs without it.
plot = ["matplotlib>=3.7"]
# The browser front end (locqa_web). The checks never import any of this.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",      # 3.2+: Connection.notifies(timeout=…) for LISTEN
    "httpx>=0.27",          # FastAPI's TestClient, for tests/test_web.py
]

[project.scripts]
locqa = "locqa.cli:main"
locqa-worker = "locqa_web.worker:main"

[tool.setuptools]
packages = ["locqa", "locqa.checks", "locqa.parsers", "locqa_web"]

[tool.setuptools.package-data]
locqa_web = [
    "templates/*.html",
    "static/*",
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"
