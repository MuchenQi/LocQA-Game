# Render blueprint: one free web service, with the worker running as a thread
# inside it. The database is NOT Render's: a free Render Postgres is deleted
# 30 days after it is created, which is no good for a link that has to stay
# up. Use a free Neon database (or any Postgres) and paste its connection
# strings when Render asks (see DATABASE_URL below). With a plain Postgres,
# set only DATABASE_URL and leave DATABASE_URL_UNPOOLED empty.
#
# Render prompts for every `sync: false` value when the blueprint is first
# applied. Free-tier terms change; check render.com/docs/free.
#
# To split the worker out later (a paid plan), add a `type: worker` service
# from the same Dockerfile with dockerCommand `locqa-worker`, and set
# LOCQA_INLINE_WORKER=0 here. The worker then hears about new runs through
# Postgres LISTEN/NOTIFY.

services:
  - type: web
    name: locqa
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Neon's two strings for the production branch:
      #   neon connection-string production --pooled   -> DATABASE_URL
      #   neon connection-string production            -> DATABASE_URL_UNPOOLED
      # Queries use the pooled one; migrations and LISTEN use the direct one.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: LOCQA_BASE_URL
        sync: false                 # e.g. https://locqa.onrender.com — used in reset emails
      - key: LOCQA_SECURE_COOKIES
        value: "1"
      - key: LOCQA_INLINE_WORKER
        value: "1"
      # Password reset email. Leave LOCQA_MAIL_BACKEND as "console" until
      # you have a Resend key; reset links then appear in the service logs.
      - key: LOCQA_MAIL_BACKEND
        value: console
      - key: LOCQA_MAIL_FROM
        value: "locqa <onboarding@resend.dev>"
      - key: RESEND_API_KEY
        sync: false
