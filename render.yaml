# Render blueprint: one web service (with the worker as a thread inside it)
# and one Postgres database. Free-tier limits and expiry rules change; check
# Render's current terms before relying on this for anything that matters.
#
# To split the worker out later, add a `type: worker` service from the same
# Dockerfile with dockerCommand `locqa-worker`, and set LOCQA_INLINE_WORKER=0
# on the web service.

services:
  - type: web
    name: locqa
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: locqa-db
          property: connectionString
      - key: LOCQA_SECURE_COOKIES
        value: "1"
      - key: LOCQA_INLINE_WORKER
        value: "1"

databases:
  - name: locqa-db
    plan: free
