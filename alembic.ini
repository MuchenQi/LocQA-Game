# Alembic CLI config, for writing new migrations:
#
#   alembic revision --autogenerate -m "add a column"
#   alembic upgrade head            # the app also does this at startup
#
# The database URL comes from DATABASE_URL (see locqa_web/settings.py), not
# from this file, so the CLI and the app can never point at different places.

[alembic]
script_location = %(here)s/locqa_web/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
